name: Release Package

on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate versions.json mapping
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          MANIFEST_MIN_APP_VERSION="$(node -p "require('./manifest.json').minAppVersion")"
          VERSION_MAP="$(node -p "const v=require('./versions.json'); v[require('./manifest.json').version] || ''")"

          if [ -z "$VERSION_MAP" ]; then
            echo "versions.json missing entry for $MANIFEST_VERSION"
            exit 1
          fi

          if [ "$VERSION_MAP" != "$MANIFEST_MIN_APP_VERSION" ]; then
            echo "versions.json mapping mismatch: expected $MANIFEST_VERSION -> $MANIFEST_MIN_APP_VERSION, got $VERSION_MAP"
            exit 1
          fi

      - name: Validate tag/version consistency
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"

          if [[ "$TAG" == v* ]]; then
            echo "Release tags must match manifest version exactly and must not use a v prefix."
            echo "Use $MANIFEST_VERSION instead of v$MANIFEST_VERSION."
            exit 1
          fi

          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag version ($TAG) does not match manifest version ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Setup Mock for CI
        run: |
          mkdir -p node_modules/obsidian
          cp __mocks__/obsidian.js node_modules/obsidian/index.js

      - name: Obsidian mobile and release readiness guard
        run: npm run review:guard

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: release_notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NOTES_FILE="RELEASE_NOTES/v${VERSION}.md"

          if [ -f "$NOTES_FILE" ]; then
            # Extract title from YAML front matter
            TITLE=$(sed -n 's/^title: *//p' "$NOTES_FILE" | head -1)
            echo "title=$TITLE" >> $GITHUB_OUTPUT

            # Extract body (everything after the second ---)
            # Use awk to get content after the closing front matter delimiter
            awk '/^---$/{n++;next} n>=2' "$NOTES_FILE" > /tmp/release_body.md
            echo "body_file=/tmp/release_body.md" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✅ Found release notes: $NOTES_FILE"
            echo "Title: $TITLE"
            echo "Body preview:"
            head -5 /tmp/release_body.md
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️ Release notes file not found: $NOTES_FILE"
          fi

      - name: Attest release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}${{ steps.release_notes.outputs.found == 'true' && format(' - {0}', steps.release_notes.outputs.title) || '' }}
          body_path: ${{ steps.release_notes.outputs.body_file }}
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 国内镜像：把三个安装资产同步到 Gitee 的 Release。
      # Gitee 单独对 GitHub 不可达的用户提供安装包，GitHub 仍是唯一发布源。
      # 失败不阻塞主流程（continue-on-error），Gitee 侧可稍后手动补传。
      - name: Sync release assets to Gitee
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: david_lin1002
          GITEE_REPO: obsidian-wechat-converter
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail

          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::GITEE_TOKEN is not configured — skipping Gitee release sync."
            exit 0
          fi

          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"

          # 发行版标题与说明：复用 GitHub 侧已解析出的 release notes。
          TITLE="$(node -p "require('./manifest.json').version")"
          NOTES_FILE="${GITHUB_WORKSPACE}/RELEASE_NOTES/v${TITLE}.md"
          if [ -f "$NOTES_FILE" ]; then
            BODY="$(awk '/^---$/{n++;next} n>=2' "$NOTES_FILE")"
          else
            BODY="Release ${TITLE}"
          fi

          # 1) 创建或复用 Gitee Release（幂等：已存在则取回其 id）。
          PAYLOAD="$(node -e '
            const [tag, title, body] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              tag_name: tag, name: title, body, prerelease: false, target_commitish: "main"
            }));
          ' "$RELEASE_TAG" "$TITLE" "$BODY")"

          RESP="$(curl -sS -X POST "${API}/releases?access_token=${GITEE_TOKEN}" \
            -H "Content-Type: application/json;charset=UTF-8" -d "$PAYLOAD")"

          RELEASE_ID="$(printf '%s' "$RESP" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              try{const j=JSON.parse(s);process.stdout.write(String(j.id||""))}catch{process.stdout.write("")}
            });')"

          if [ -z "$RELEASE_ID" ]; then
            echo "::warning::Failed to create Gitee release. Response: $RESP"
            exit 0
          fi
          echo "Gitee release id: $RELEASE_ID"

          # 2) 逐个上传三个安装资产（已存在同名附件时先删后传，保证内容与 GitHub 一致）。
          for FILE in main.js manifest.json styles.css; do
            EXISTING_ID="$(curl -sS "${API}/releases/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}" \
              | node -e '
                let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                  const name=process.argv[1];let out="";
                  try{const arr=JSON.parse(s);const hit=arr.find(f=>f.name===name);if(hit)out=String(hit.id)}catch{}
                  process.stdout.write(out);
                });' "$FILE")"

            if [ -n "$EXISTING_ID" ]; then
              curl -sS -X DELETE "${API}/releases/${RELEASE_ID}/attach_files/${EXISTING_ID}?access_token=${GITEE_TOKEN}" >/dev/null || true
            fi

            echo "Uploading $FILE ..."
            curl -sS -X POST "${API}/releases/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}" \
              -F "file=@${FILE}" >/dev/null || echo "::warning::Upload failed for $FILE"
          done

          echo "Gitee release sync finished for ${RELEASE_TAG}."
